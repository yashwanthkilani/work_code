# Sample log4j 2 config for Spark 3.3+ (copy to libs/log4j2.properties on the edge node).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Job and framework loggers
logger.googleGeoCode.name = com.googleGeoCode
logger.googleGeoCode.level = info

logger.almaren.name = com.github.music.of.the.ainur.almaren
logger.almaren.level = info
